# Site Settings
encoding: UTF-8
exclude:
  [
    '*.gem',
    '*.gemspec',
    'doc',
    'docs',
    'Gemfile',
    'Gemfile.lock',
    'node_modules',
    'Rakefile',
    'starter-kit',
    'asmita-pal.github.io',
    'vendor',
  ]
lang: en
permalink: /:year/:month/:day/:title/
remote_theme: yizeng/jekyll-theme-simple-texture

whitelist: [jekyll-feed, jekyll-redirect-from, jekyll-seo-tag, jekyll-sitemap]
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  -
    scope:
      path: "assets/**/*.*"
    values:
      sitemap: false

markdown: kramdown
kramdown:
  auto_id_prefix: 'heading-'
  smart_quotes: ['apos', 'apos', 'quot', 'quot']
  toc_levels: 1..3

sass:
  style: compressed

# Site Data
url: https://asmita-pal.github.io # the base hostname & protocol for your site, e.g. http://example.com
baseurl: # the subpath of your site, e.g. /blog
