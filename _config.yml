description: Asmita Pal, PhD Candidate in Computer Architecture at University of Wisconsin-Madison
keywords: 'Asmita Pal, UW-Madison, PhD student, computer architecture, approximate computing, hardware, AI, chip design, security'
author:
  name: Asmita Pal
  job_title: PhD Candidate
  location: UW-Madison
  # email: developer@yizeng.me
  social_links:
