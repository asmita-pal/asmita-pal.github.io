  cc_license_image: # Choose one at https://creativecommons.org/choose/
  footer_content: 

disqus:
  shortname: 
  public_key: 
google_tag_manager: 
addthis_public_id: # AddThis sharing plugin. See http://www.addthis.com/

paths:
  home: /
